<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products — ShopLite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface2: #161616;
            --border: #222222;
            --accent: #e8ff47;
            --accent-dim: #c8df27;
            --text: #f0f0f0;
            --text-muted: #666666;
            --error: #ff4747;
            --success: #47ff8a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(232,255,71,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232,255,71,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* NAV */
        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .nav-brand {
            font-family: 'Syne', sans-serif;
            font-size: 22px;
            font-weight: 800;
            letter-spacing: -0.5px;
            text-decoration: none;
            color: var(--text);
        }

        .nav-brand span { color: var(--accent); }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .nav-user {
            font-size: 13px;
            color: var(--text-muted);
        }

        .nav-link {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
            color: var(--text);
            border: 1px solid var(--border);
        }

        .nav-link:hover { border-color: var(--accent); color: var(--accent); }

        .nav-link.accent {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
            font-family: 'Syne', sans-serif;
            font-weight: 700;
        }

        .nav-link.accent:hover { background: var(--accent-dim); }

        .logout-btn {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover { border-color: var(--error); color: var(--error); }

        /* MAIN */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 40px;
            position: relative;
            z-index: 1;
        }

        .page-header {
            margin-bottom: 40px;
        }

        .page-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .page-header p {
            color: var(--text-muted);
            margin-top: 6px;
            font-size: 14px;
        }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 500;
            z-index: 1000;
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success { background: var(--success); color: #000; }
        .toast.error { background: var(--error); color: #fff; }

        /* PRODUCTS GRID */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s;
            position: relative;
        }

        .product-card:hover {
            border-color: #333;
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .product-image {
            height: 180px;
            background: var(--surface2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            border-bottom: 1px solid var(--border);
            position: relative;
        }

        .stock-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            font-family: 'Syne', sans-serif;
        }

        .stock-badge.in-stock { background: rgba(71,255,138,0.15); color: var(--success); border: 1px solid rgba(71,255,138,0.3); }
        .stock-badge.low-stock { background: rgba(255,165,0,0.15); color: orange; border: 1px solid rgba(255,165,0,0.3); }
        .stock-badge.out-stock { background: rgba(255,71,71,0.15); color: var(--error); border: 1px solid rgba(255,71,71,0.3); }

        .product-info {
            padding: 20px;
        }

        .product-category {
            font-size: 11px;
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .product-name {
            font-family: 'Syne', sans-serif;
            font-size: 17px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.3px;
        }

        .product-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 16px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .product-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .product-price {
            font-family: 'Syne', sans-serif;
            font-size: 20px;
            font-weight: 800;
            color: var(--accent);
        }

        .add-to-cart-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 9px 16px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 8px;
            font-family: 'Syne', sans-serif;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }

        .add-to-cart-btn:hover { background: var(--accent-dim); transform: scale(1.05); }
        .add-to-cart-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .loading {
            text-align: center;
            padding: 80px 20px;
            color: var(--text-muted);
            font-size: 15px;
        }

        .loading::after {
            content: '';
            display: block;
            width: 32px;
            height: 32px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            margin: 16px auto 0;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Category icons map */
        .cat-icon { font-size: 40px; }
    </style>
</head>
<body>

    <nav>
        <a href="index.html" class="nav-brand">Shop<span>Lite</span></a>
        <div class="nav-actions">
            <span class="nav-user" id="nav-user"></span>
            <a href="cart.html" class="nav-link">🛒 Cart</a>
            <a href="orders.html" class="nav-link">📦 Orders</a>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h2>All Products</h2>
            <p>Browse our collection and add items to your cart</p>
        </div>

        <div id="products-container" class="loading">Loading products...</div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="js/api.js"></script>
    <script>
        // Auth check
        if (!getToken()) window.location.href = 'login.html';

        const user = getUser();
        if (user) document.getElementById('nav-user').textContent = `Hi, ${user.name}`;

        function getCategoryIcon(category) {
            const icons = {
                'Electronics': '📱', 'Laptops': '💻', 'Audio': '🎧',
                'Tablets': '📟', 'Monitors': '🖥️', 'Footwear': '👟',
                'Accessories': '🖱️', 'default': '📦'
            };
            return icons[category] || icons['default'];
        }

        function getStockInfo(stock) {
            if (stock === 0) return { label: 'Out of Stock', class: 'out-stock' };
            if (stock <= 5) return { label: `Only ${stock} left!`, class: 'low-stock' };
            return { label: 'In Stock', class: 'in-stock' };
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        async function loadProducts() {
            try {
                const data = await apiRequest('/products');
                const container = document.getElementById('products-container');

                if (!data.products.length) {
                    container.innerHTML = '<p style="color:var(--text-muted);text-align:center;padding:60px">No products found.</p>';
                    return;
                }

                container.className = 'products-grid';
                container.innerHTML = data.products.map(p => {
                    const stock = getStockInfo(p.stock);
                    return `
                    <div class="product-card">
                        <div class="product-image">
                            <span class="cat-icon">${getCategoryIcon(p.category)}</span>
                            <span class="stock-badge ${stock.class}">${stock.label}</span>
                        </div>
                        <div class="product-info">
                            <div class="product-category">${p.category || 'General'}</div>
                            <div class="product-name">${p.name}</div>
                            <div class="product-desc">${p.description || 'No description available.'}</div>
                            <div class="product-footer">
                                <div class="product-price">₹${Number(p.price).toLocaleString('en-IN')}</div>
                                <button class="add-to-cart-btn"
                                    onclick="addToCart(${p.id}, this)"
                                    ${p.stock === 0 ? 'disabled' : ''}>
                                    + Cart
                                </button>
                            </div>
                        </div>
                    </div>`;
                }).join('');
            } catch (err) {
                document.getElementById('products-container').innerHTML =
                    '<p style="color:var(--error);text-align:center;padding:60px">Failed to load products.</p>';
            }
        }

        async function addToCart(productId, btn) {
            btn.disabled = true;
            btn.textContent = '...';
            try {
                await apiRequest('/cart', 'POST', { product_id: productId, quantity: 1 }, true);
                showToast('Added to cart! 🛒');
                btn.textContent = '✓ Added';
                setTimeout(() => {
                    btn.textContent = '+ Cart';
                    btn.disabled = false;
                }, 2000);
            } catch (err) {
                showToast(err.data?.message || 'Failed to add.', 'error');
                btn.textContent = '+ Cart';
                btn.disabled = false;
            }
        }

        async function handleLogout() {
            try {
                await apiRequest('/logout', 'DELETE', null, true);
            } finally {
                removeToken();
                removeUser();
                window.location.href = 'login.html';
            }
        }

        loadProducts();
    </script>
</body>
</html>
