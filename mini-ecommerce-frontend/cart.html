<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart — ShopLite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface2: #161616;
            --border: #222222;
            --accent: #e8ff47;
            --accent-dim: #c8df27;
            --text: #f0f0f0;
            --text-muted: #666666;
            --error: #ff4747;
            --success: #47ff8a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(232,255,71,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232,255,71,0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10,10,10,0.9);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 40px; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .nav-brand {
            font-family: 'Syne', sans-serif; font-size: 22px;
            font-weight: 800; text-decoration: none; color: var(--text);
        }
        .nav-brand span { color: var(--accent); }

        .nav-actions { display: flex; align-items: center; gap: 16px; }

        .nav-link {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 8px;
            text-decoration: none; font-size: 14px; font-weight: 500;
            transition: all 0.2s; color: var(--text); border: 1px solid var(--border);
        }
        .nav-link:hover { border-color: var(--accent); color: var(--accent); }

        .logout-btn {
            background: none; border: 1px solid var(--border);
            color: var(--text-muted); padding: 8px 16px; border-radius: 8px;
            font-family: 'DM Sans', sans-serif; font-size: 14px;
            cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { border-color: var(--error); color: var(--error); }

        main {
            max-width: 900px; margin: 0 auto;
            padding: 48px 40px; position: relative; z-index: 1;
        }

        .page-header {
            display: flex; align-items: center;
            justify-content: space-between; margin-bottom: 32px;
        }

        .page-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 32px; font-weight: 800; letter-spacing: -1px;
        }

        .toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 14px 20px; border-radius: 12px;
            font-size: 14px; font-weight: 500; z-index: 1000;
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); color: #000; }
        .toast.error { background: var(--error); color: #fff; }

        .cart-list { display: flex; flex-direction: column; gap: 12px; }

        .cart-item {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px 24px;
            display: flex; align-items: center; gap: 20px;
            transition: border-color 0.2s;
        }
        .cart-item:hover { border-color: #333; }

        .item-icon {
            width: 56px; height: 56px; border-radius: 12px;
            background: var(--surface2); display: flex;
            align-items: center; justify-content: center;
            font-size: 24px; flex-shrink: 0;
            border: 1px solid var(--border);
        }

        .item-info { flex: 1; }

        .item-category {
            font-size: 11px; color: var(--accent);
            text-transform: uppercase; letter-spacing: 1px;
            font-weight: 600; margin-bottom: 4px;
        }

        .item-name {
            font-family: 'Syne', sans-serif;
            font-size: 16px; font-weight: 700; margin-bottom: 4px;
        }

        .item-price { font-size: 13px; color: var(--text-muted); }

        .item-controls {
            display: flex; align-items: center; gap: 12px;
        }

        .qty-control {
            display: flex; align-items: center; gap: 8px;
            background: var(--surface2); border: 1px solid var(--border);
            border-radius: 10px; padding: 6px;
        }

        .qty-btn {
            width: 28px; height: 28px; border: none;
            background: var(--border); color: var(--text);
            border-radius: 6px; cursor: pointer;
            font-size: 16px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.15s;
        }
        .qty-btn:hover { background: var(--accent); color: #000; }

        .qty-value {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 15px;
            min-width: 28px; text-align: center;
        }

        .item-total {
            font-family: 'Syne', sans-serif;
            font-size: 18px; font-weight: 800;
            color: var(--accent); min-width: 100px; text-align: right;
        }

        .remove-btn {
            background: none; border: 1px solid var(--border);
            color: var(--text-muted); width: 36px; height: 36px;
            border-radius: 8px; cursor: pointer;
            font-size: 16px; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        .remove-btn:hover { border-color: var(--error); color: var(--error); }

        /* Summary */
        .cart-summary {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; padding: 24px; margin-top: 24px;
            position: relative; overflow: hidden;
        }

        .cart-summary::before {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; height: 2px;
            background: var(--accent);
        }

        .summary-row {
            display: flex; justify-content: space-between;
            align-items: center; padding: 8px 0;
        }

        .summary-row.total {
            border-top: 1px solid var(--border);
            margin-top: 12px; padding-top: 20px;
        }

        .summary-label { color: var(--text-muted); font-size: 14px; }
        .summary-label.total-label {
            font-family: 'Syne', sans-serif;
            font-size: 16px; font-weight: 700; color: var(--text);
        }

        .summary-value {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 15px;
        }

        .summary-value.total-value {
            font-size: 24px; color: var(--accent);
        }

        .checkout-btn {
            width: 100%; padding: 16px;
            background: var(--accent); color: #000;
            border: none; border-radius: 12px;
            font-family: 'Syne', sans-serif; font-size: 16px;
            font-weight: 800; cursor: pointer; margin-top: 20px;
            transition: all 0.2s; letter-spacing: 0.3px;
        }
        .checkout-btn:hover { background: var(--accent-dim); transform: translateY(-2px); }
        .checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .empty-cart {
            text-align: center; padding: 80px 20px;
            color: var(--text-muted);
        }
        .empty-cart .icon { font-size: 64px; margin-bottom: 16px; }
        .empty-cart h3 {
            font-family: 'Syne', sans-serif;
            font-size: 20px; margin-bottom: 8px; color: var(--text);
        }
        .empty-cart a {
            display: inline-block; margin-top: 20px;
            padding: 12px 24px; background: var(--accent);
            color: #000; text-decoration: none; border-radius: 10px;
            font-family: 'Syne', sans-serif; font-weight: 700;
        }

        .loading {
            text-align: center; padding: 80px 20px;
            color: var(--text-muted); font-size: 15px;
        }
        .loading::after {
            content: ''; display: block; width: 32px; height: 32px;
            border: 2px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; margin: 16px auto 0;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">Shop<span>Lite</span></a>
        <div class="nav-actions">
            <a href="index.html" class="nav-link">🏠 Products</a>
            <a href="orders.html" class="nav-link">📦 Orders</a>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h2>🛒 My Cart</h2>
        </div>
        <div id="cart-container" class="loading">Loading cart...</div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="js/api.js"></script>
    <script>
        if (!getToken()) window.location.href = 'login.html';

        const icons = {
            'Electronics': '📱', 'Laptops': '💻', 'Audio': '🎧',
            'Tablets': '📟', 'Monitors': '🖥️', 'Footwear': '👟',
            'Accessories': '🖱️', 'default': '📦'
        };

        function getIcon(cat) { return icons[cat] || icons['default']; }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        let cartData = [];

        async function loadCart() {
            try {
                const data = await apiRequest('/cart', 'GET', null, true);
                cartData = data.cart;
                renderCart();
            } catch {
                document.getElementById('cart-container').innerHTML =
                    '<p style="color:var(--error);text-align:center;padding:60px">Failed to load cart.</p>';
            }
        }

        function renderCart() {
            const container = document.getElementById('cart-container');

            if (!cartData.length) {
                container.innerHTML = `
                    <div class="empty-cart">
                        <div class="icon">🛒</div>
                        <h3>Your cart is empty</h3>
                        <p>Add some products to get started</p>
                        <a href="index.html">Browse Products</a>
                    </div>`;
                return;
            }

            const total = cartData.reduce((sum, item) =>
                sum + (item.product.price * item.quantity), 0);

            container.innerHTML = `
                <div class="cart-list">
                    ${cartData.map(item => `
                    <div class="cart-item" id="item-${item.id}">
                        <div class="item-icon">${getIcon(item.product?.category)}</div>
                        <div class="item-info">
                            <div class="item-category">${item.product?.category || 'General'}</div>
                            <div class="item-name">${item.product?.name}</div>
                            <div class="item-price">₹${Number(item.product?.price).toLocaleString('en-IN')} each</div>
                        </div>
                        <div class="item-controls">
                            <div class="qty-control">
                                <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity - 1})">−</button>
                                <span class="qty-value">${item.quantity}</span>
                                <button class="qty-btn" onclick="updateQty(${item.id}, ${item.quantity + 1})">+</button>
                            </div>
                        </div>
                        <div class="item-total">₹${Number(item.product?.price * item.quantity).toLocaleString('en-IN')}</div>
                        <button class="remove-btn" onclick="removeItem(${item.id})">✕</button>
                    </div>`).join('')}
                </div>

                <div class="cart-summary">
                    <div class="summary-row">
                        <span class="summary-label">Items (${cartData.length})</span>
                        <span class="summary-value">${cartData.reduce((s, i) => s + i.quantity, 0)} units</span>
                    </div>
                    <div class="summary-row total">
                        <span class="summary-label total-label">Total</span>
                        <span class="summary-value total-value">₹${Number(total).toLocaleString('en-IN')}</span>
                    </div>
                    <button class="checkout-btn" onclick="placeOrder()">Place Order →</button>
                </div>`;
        }

        async function updateQty(id, newQty) {
            if (newQty < 1) return removeItem(id);
            try {
                await apiRequest(`/cart/${id}`, 'PUT', { quantity: newQty }, true);
                const item = cartData.find(i => i.id === id);
                if (item) item.quantity = newQty;
                renderCart();
            } catch (err) {
                showToast(err.data?.message || 'Failed to update.', 'error');
            }
        }

        async function removeItem(id) {
            try {
                await apiRequest(`/cart/${id}`, 'DELETE', null, true);
                cartData = cartData.filter(i => i.id !== id);
                renderCart();
                showToast('Item removed.');
            } catch {
                showToast('Failed to remove item.', 'error');
            }
        }

        async function placeOrder() {
            const btn = document.querySelector('.checkout-btn');
            btn.disabled = true;
            btn.textContent = 'Placing order...';
            try {
                await apiRequest('/orders', 'POST', null, true);
                showToast('Order placed successfully! 🎉');
                setTimeout(() => window.location.href = 'orders.html', 1500);
            } catch (err) {
                showToast(err.data?.message || 'Failed to place order.', 'error');
                btn.disabled = false;
                btn.textContent = 'Place Order →';
            }
        }

        async function handleLogout() {
            try { await apiRequest('/logout', 'DELETE', null, true); } finally {
                removeToken(); removeUser();
                window.location.href = 'login.html';
            }
        }

        loadCart();
    </script>
</body>
</html>
