<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — ShopLite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --border: #222222;
            --accent: #e8ff47;
            --accent-dim: #c8df27;
            --text: #f0f0f0;
            --text-muted: #666666;
            --error: #ff4747;
            --success: #47ff8a;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Background grid */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(232,255,71,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232,255,71,0.03) 1px, transparent 1px);
            background-size: 60px 60px;
            pointer-events: none;
        }

        .container {
            width: 100%;
            max-width: 440px;
            position: relative;
            z-index: 1;
        }

        .brand {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand h1 {
            font-family: 'Syne', sans-serif;
            font-size: 36px;
            font-weight: 800;
            letter-spacing: -1px;
        }

        .brand h1 span {
            color: var(--accent);
        }

        .brand p {
            color: var(--text-muted);
            font-size: 14px;
            margin-top: 6px;
        }

        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 36px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: var(--accent);
        }

        .tabs {
            display: flex;
            gap: 4px;
            background: var(--bg);
            border-radius: 10px;
            padding: 4px;
            margin-bottom: 28px;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            font-size: 13px;
            letter-spacing: 0.5px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            background: transparent;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab.active {
            background: var(--accent);
            color: #000;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-muted);
            letter-spacing: 0.8px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 13px 16px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            transition: border-color 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        .btn {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }

        .btn:hover {
            background: var(--accent-dim);
            transform: translateY(-1px);
        }

        .btn:active { transform: translateY(0); }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 18px;
            display: none;
        }

        .alert.error { background: rgba(255,71,71,0.1); border: 1px solid var(--error); color: var(--error); }
        .alert.success { background: rgba(71,255,138,0.1); border: 1px solid var(--success); color: var(--success); }
        .alert.show { display: block; }

        .form-panel { display: none; }
        .form-panel.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="brand">
            <h1>Shop<span>Lite</span></h1>
            <p>Your minimal shopping experience</p>
        </div>

        <div class="card">
            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Login</button>
                <button class="tab" onclick="switchTab('register')">Register</button>
            </div>

            <div id="alert" class="alert"></div>

            <!-- Login Form -->
            <div id="login-panel" class="form-panel active">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="login-password" placeholder="••••••••">
                </div>
                <button class="btn" id="login-btn" onclick="handleLogin()">Login</button>
            </div>

            <!-- Register Form -->
            <div id="register-panel" class="form-panel">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="reg-name" placeholder="Prashant Yadav">
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="reg-email" placeholder="you@example.com">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="reg-password" placeholder="Min 6 characters">
                </div>
                <button class="btn" id="reg-btn" onclick="handleRegister()">Create Account</button>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script>
        // Redirect if already logged in
        if (getToken()) window.location.href = 'index.html';

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
            });
            document.getElementById('login-panel').classList.toggle('active', tab === 'login');
            document.getElementById('register-panel').classList.toggle('active', tab === 'register');
            hideAlert();
        }

        function showAlert(message, type = 'error') {
            const alert = document.getElementById('alert');
            alert.textContent = message;
            alert.className = `alert ${type} show`;
        }

        function hideAlert() {
            document.getElementById('alert').className = 'alert';
        }

        async function handleLogin() {
            const email    = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;

            if (!email || !password) return showAlert('Please fill all fields.');

            const btn = document.getElementById('login-btn');
            btn.disabled = true;
            btn.textContent = 'Logging in...';

            try {
                const data = await apiRequest('/login', 'POST', { email, password });
                setToken(data.token);
                setUser(data.user);
                window.location.href = 'index.html';
            } catch (err) {
                showAlert(err.data?.message || 'Login failed.');
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        async function handleRegister() {
            const name     = document.getElementById('reg-name').value;
            const email    = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;

            if (!name || !email || !password) return showAlert('Please fill all fields.');

            const btn = document.getElementById('reg-btn');
            btn.disabled = true;
            btn.textContent = 'Creating account...';

            try {
                const data = await apiRequest('/register', 'POST', { name, email, password });
                setToken(data.token);
                setUser(data.user);
                window.location.href = 'index.html';
            } catch (err) {
                const errors = err.data?.errors;
                const msg = errors ? Object.values(errors)[0][0] : (err.data?.message || 'Registration failed.');
                showAlert(msg);
                btn.disabled = false;
                btn.textContent = 'Create Account';
            }
        }

        // Enter key support
        document.addEventListener('keydown', e => {
            if (e.key === 'Enter') {
                const activePanel = document.querySelector('.form-panel.active').id;
                activePanel === 'login-panel' ? handleLogin() : handleRegister();
            }
        });
    </script>
</body>
</html>
