<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders — ShopLite</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg: #0a0a0a;
            --surface: #111111;
            --surface2: #161616;
            --border: #222222;
            --accent: #e8ff47;
            --text: #f0f0f0;
            --text-muted: #666666;
            --error: #ff4747;
            --success: #47ff8a;
        }

        body {
            background: var(--bg); color: var(--text);
            font-family: 'DM Sans', sans-serif; min-height: 100vh;
        }

        body::before {
            content: ''; position: fixed; inset: 0;
            background-image:
                linear-gradient(rgba(232,255,71,0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(232,255,71,0.02) 1px, transparent 1px);
            background-size: 60px 60px; pointer-events: none; z-index: 0;
        }

        nav {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10,10,10,0.9); backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 40px; height: 64px;
            display: flex; align-items: center; justify-content: space-between;
        }

        .nav-brand {
            font-family: 'Syne', sans-serif; font-size: 22px;
            font-weight: 800; text-decoration: none; color: var(--text);
        }
        .nav-brand span { color: var(--accent); }

        .nav-actions { display: flex; align-items: center; gap: 16px; }

        .nav-link {
            display: flex; align-items: center; gap: 8px;
            padding: 8px 16px; border-radius: 8px;
            text-decoration: none; font-size: 14px; font-weight: 500;
            transition: all 0.2s; color: var(--text); border: 1px solid var(--border);
        }
        .nav-link:hover { border-color: var(--accent); color: var(--accent); }

        .logout-btn {
            background: none; border: 1px solid var(--border);
            color: var(--text-muted); padding: 8px 16px; border-radius: 8px;
            font-family: 'DM Sans', sans-serif; font-size: 14px;
            cursor: pointer; transition: all 0.2s;
        }
        .logout-btn:hover { border-color: var(--error); color: var(--error); }

        main {
            max-width: 900px; margin: 0 auto;
            padding: 48px 40px; position: relative; z-index: 1;
        }

        .page-header { margin-bottom: 32px; }
        .page-header h2 {
            font-family: 'Syne', sans-serif;
            font-size: 32px; font-weight: 800; letter-spacing: -1px;
        }
        .page-header p { color: var(--text-muted); margin-top: 6px; font-size: 14px; }

        .toast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 14px 20px; border-radius: 12px;
            font-size: 14px; font-weight: 500; z-index: 1000;
            transform: translateY(100px); opacity: 0;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: var(--success); color: #000; }
        .toast.error { background: var(--error); color: #fff; }

        .orders-list { display: flex; flex-direction: column; gap: 16px; }

        .order-card {
            background: var(--surface); border: 1px solid var(--border);
            border-radius: 16px; overflow: hidden; transition: border-color 0.2s;
        }
        .order-card:hover { border-color: #333; }

        .order-header {
            padding: 20px 24px;
            display: flex; align-items: center; justify-content: space-between;
            cursor: pointer; user-select: none;
        }

        .order-header-left { display: flex; align-items: center; gap: 16px; }

        .order-id {
            font-family: 'Syne', sans-serif;
            font-size: 15px; font-weight: 700;
        }

        .order-date { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .status-badge {
            padding: 5px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 700;
            font-family: 'Syne', sans-serif; letter-spacing: 0.5px;
            text-transform: uppercase;
        }
        .status-pending { background: rgba(255,165,0,0.15); color: orange; border: 1px solid rgba(255,165,0,0.3); }
        .status-completed { background: rgba(71,255,138,0.15); color: var(--success); border: 1px solid rgba(71,255,138,0.3); }
        .status-cancelled { background: rgba(255,71,71,0.15); color: var(--error); border: 1px solid rgba(255,71,71,0.3); }

        .order-header-right { display: flex; align-items: center; gap: 16px; }

        .order-total {
            font-family: 'Syne', sans-serif;
            font-size: 18px; font-weight: 800; color: var(--accent);
        }

        .cancel-btn {
            padding: 7px 14px; background: none;
            border: 1px solid var(--border); color: var(--text-muted);
            border-radius: 8px; font-size: 12px; cursor: pointer;
            transition: all 0.2s; font-family: 'DM Sans', sans-serif;
        }
        .cancel-btn:hover { border-color: var(--error); color: var(--error); }

        .chevron {
            font-size: 12px; color: var(--text-muted);
            transition: transform 0.3s;
        }
        .chevron.open { transform: rotate(180deg); }

        .order-items {
            border-top: 1px solid var(--border);
            display: none; padding: 16px 24px;
            background: var(--surface2);
        }
        .order-items.open { display: block; }

        .order-item {
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
        }
        .order-item:last-child { border-bottom: none; }

        .order-item-name { font-size: 14px; font-weight: 500; }
        .order-item-qty { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

        .order-item-price {
            font-family: 'Syne', sans-serif;
            font-weight: 700; font-size: 14px; color: var(--accent);
        }

        .empty-orders {
            text-align: center; padding: 80px 20px; color: var(--text-muted);
        }
        .empty-orders .icon { font-size: 64px; margin-bottom: 16px; }
        .empty-orders h3 {
            font-family: 'Syne', sans-serif;
            font-size: 20px; margin-bottom: 8px; color: var(--text);
        }
        .empty-orders a {
            display: inline-block; margin-top: 20px;
            padding: 12px 24px; background: var(--accent);
            color: #000; text-decoration: none; border-radius: 10px;
            font-family: 'Syne', sans-serif; font-weight: 700;
        }

        .loading {
            text-align: center; padding: 80px 20px;
            color: var(--text-muted); font-size: 15px;
        }
        .loading::after {
            content: ''; display: block; width: 32px; height: 32px;
            border: 2px solid var(--border); border-top-color: var(--accent);
            border-radius: 50%; margin: 16px auto 0;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <nav>
        <a href="index.html" class="nav-brand">Shop<span>Lite</span></a>
        <div class="nav-actions">
            <a href="index.html" class="nav-link">🏠 Products</a>
            <a href="cart.html" class="nav-link">🛒 Cart</a>
            <button class="logout-btn" onclick="handleLogout()">Logout</button>
        </div>
    </nav>

    <main>
        <div class="page-header">
            <h2>📦 My Orders</h2>
            <p>Track and manage your order history</p>
        </div>
        <div id="orders-container" class="loading">Loading orders...</div>
    </main>

    <div id="toast" class="toast"></div>

    <script src="js/api.js"></script>
    <script>
        if (!getToken()) window.location.href = 'login.html';

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.className = 'toast', 3000);
        }

        function formatDate(dateStr) {
            return new Date(dateStr).toLocaleDateString('en-IN', {
                day: 'numeric', month: 'short', year: 'numeric',
                hour: '2-digit', minute: '2-digit'
            });
        }

        function toggleItems(orderId) {
            const items = document.getElementById(`items-${orderId}`);
            const chevron = document.getElementById(`chevron-${orderId}`);
            items.classList.toggle('open');
            chevron.classList.toggle('open');
        }

        async function cancelOrder(id, btn) {
            if (!confirm('Cancel this order?')) return;
            btn.disabled = true;
            btn.textContent = 'Cancelling...';
            try {
                await apiRequest(`/orders/${id}/cancel`, 'PATCH', null, true);
                showToast('Order cancelled successfully.');
                loadOrders();
            } catch (err) {
                showToast(err.data?.message || 'Failed to cancel.', 'error');
                btn.disabled = false;
                btn.textContent = 'Cancel';
            }
        }

        async function loadOrders() {
            try {
                const data = await apiRequest('/orders', 'GET', null, true);
                const container = document.getElementById('orders-container');

                if (!data.orders.length) {
                    container.innerHTML = `
                        <div class="empty-orders">
                            <div class="icon">📦</div>
                            <h3>No orders yet</h3>
                            <p>Place your first order to see it here</p>
                            <a href="index.html">Shop Now</a>
                        </div>`;
                    return;
                }

                container.className = 'orders-list';
                container.innerHTML = data.orders.map(order => `
                    <div class="order-card">
                        <div class="order-header" onclick="toggleItems(${order.id})">
                            <div class="order-header-left">
                                <div>
                                    <div class="order-id">Order #${order.id}</div>
                                    <div class="order-date">${formatDate(order.created_at)}</div>
                                </div>
                                <span class="status-badge status-${order.status}">${order.status}</span>
                            </div>
                            <div class="order-header-right">
                                <div class="order-total">₹${Number(order.total_amount).toLocaleString('en-IN')}</div>
                                ${order.status === 'pending' ? `
                                    <button class="cancel-btn" onclick="event.stopPropagation(); cancelOrder(${order.id}, this)">
                                        Cancel
                                    </button>` : ''}
                                <span class="chevron" id="chevron-${order.id}">▼</span>
                            </div>
                        </div>
                        <div class="order-items" id="items-${order.id}">
                            ${order.items.map(item => `
                                <div class="order-item">
                                    <div>
                                        <div class="order-item-name">${item.product?.name || 'Product'}</div>
                                        <div class="order-item-qty">Qty: ${item.quantity}</div>
                                    </div>
                                    <div class="order-item-price">₹${Number(item.price * item.quantity).toLocaleString('en-IN')}</div>
                                </div>`).join('')}
                        </div>
                    </div>`).join('');
            } catch {
                document.getElementById('orders-container').innerHTML =
                    '<p style="color:var(--error);text-align:center;padding:60px">Failed to load orders.</p>';
            }
        }

        async function handleLogout() {
            try { await apiRequest('/logout', 'DELETE', null, true); } finally {
                removeToken(); removeUser();
                window.location.href = 'login.html';
            }
        }

        loadOrders();
    </script>
</body>
</html>
